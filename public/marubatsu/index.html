<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="○×ゲーム">
  <meta name="description" content="ノートにえんぴつで書いたような、子ども向け○×ゲーム">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>ノートで○×ゲーム</title>
  <style>
    :root{--paper:#fbf7e9;--pencil:#4d4a45;--pencil-soft:#716b63;--rule:#bfd8ec;--margin:#e7b0a6;--blue:#6f92bc;--panel:rgba(255,252,241,.78);--line:#ded5c5}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e5dc;color:var(--pencil)}
    body{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button{font:inherit;color:inherit}
    .app{min-height:100dvh;max-width:760px;margin:0 auto;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,var(--rule) 35px,transparent 36px);position:relative;padding:max(22px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom)) 48px;overflow:hidden}
    .app::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.8;pointer-events:none}
    .paper-noise{position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(circle at 20% 30%,#000 0 .6px,transparent .7px),radial-gradient(circle at 80% 60%,#000 0 .5px,transparent .6px);background-size:19px 23px,29px 31px;mix-blend-mode:multiply}.content{position:relative;z-index:1}
    .title{text-align:center;font-size:clamp(28px,7vw,42px);font-weight:800;letter-spacing:.08em;margin:8px 0 4px;transform:rotate(-.8deg);text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:4px;text-underline-offset:10px}.subtitle{text-align:center;margin:20px 0 0;font-size:clamp(16px,4vw,21px);letter-spacing:.08em;transform:rotate(.4deg)}
    .modes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 0}.mode-btn,.restart{min-height:48px;border:1.8px solid #8a8276;background:rgba(255,255,255,.52);border-radius:999px;padding:9px 16px;font-weight:800;box-shadow:1.5px 2px 0 rgba(78,75,70,.14);cursor:pointer;touch-action:manipulation}.mode-btn[aria-pressed="true"]{background:#e8eef5;border-color:#6f8195;box-shadow:inset 0 0 0 1px rgba(111,129,149,.18),1.5px 2px 0 rgba(78,75,70,.12)}.mode-btn:focus-visible,.restart:focus-visible,.cell:focus-visible{outline:3px solid #668db9;outline-offset:3px}
    .board-wrap{width:min(86vw,470px);margin:24px auto 0}.board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);position:relative;padding:7px}.gridline{position:absolute;background:var(--pencil);opacity:.88;border-radius:999px;box-shadow:0 0 0 .3px rgba(0,0,0,.1);pointer-events:none}.v1{left:33.8%;top:2%;width:3.5px;height:96%;transform:rotate(.9deg)}.v2{left:66.2%;top:2%;width:3.5px;height:96%;transform:rotate(-.7deg)}.h1{left:2%;top:33.8%;height:3.5px;width:96%;transform:rotate(-.45deg)}.h2{left:2%;top:66.2%;height:3.5px;width:96%;transform:rotate(.55deg)}
    .cell{position:relative;z-index:2;border:0;background:transparent;min-width:0;min-height:78px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer;touch-action:manipulation}.cell:disabled{cursor:default}.mark{width:72%;height:72%;overflow:visible}.mark path{fill:none;stroke:var(--pencil);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .status{max-width:530px;margin:19px auto 0;background:var(--panel);border:1.2px solid #d9cfbd;border-radius:13px;text-align:center;padding:11px 14px 10px;transform:rotate(-.15deg)}.status-main{font-size:clamp(18px,4.5vw,24px);font-weight:800;letter-spacing:.05em}.status-sub{margin-top:3px;color:var(--pencil-soft);font-size:14px;font-weight:600}.score{display:flex;justify-content:center;flex-wrap:wrap;gap:9px 20px;margin-top:16px;font-size:14px;font-weight:700}.score span{background:rgba(255,255,255,.35);padding:2px 7px;border-radius:8px}.actions{display:flex;justify-content:center;margin-top:17px}.restart{min-width:165px;background:#e7edf3;border-color:#77889b;font-size:17px}.footer-note{text-align:center;margin:19px auto 0;max-width:520px;font-size:13px;color:#686159;font-weight:600;line-height:1.7}.scribble{animation:pop .26s ease-out}@keyframes pop{from{transform:scale(.78);opacity:.3}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.scribble{animation:none}}@media(max-width:390px){.app{padding-left:40px;padding-right:10px}.app::before{left:25px}.board-wrap{width:min(91vw,430px)}.mode-btn{padding-inline:12px;font-size:14px}}
  </style>
</head>
<body>
  <main class="app" aria-label="ノート風○×ゲーム"><div class="paper-noise"></div><div class="content">
    <h1 class="title">○×ゲーム やろう</h1><p class="subtitle">3つ ならべたら かち！</p>
    <div class="modes" aria-label="あそびかた"><button class="mode-btn" id="friendBtn" type="button" aria-pressed="true">👦 おともだちと</button><button class="mode-btn" id="cpuBtn" type="button" aria-pressed="false">🤖 コンピューターと</button></div>
    <section class="board-wrap" aria-label="ゲーム盤"><div class="board" id="board" role="grid" aria-label="3かける3の○×ゲーム盤"><div class="gridline v1"></div><div class="gridline v2"></div><div class="gridline h1"></div><div class="gridline h2"></div><button class="cell" type="button" data-index="0" aria-label="左上"></button><button class="cell" type="button" data-index="1" aria-label="上まんなか"></button><button class="cell" type="button" data-index="2" aria-label="右上"></button><button class="cell" type="button" data-index="3" aria-label="左まんなか"></button><button class="cell" type="button" data-index="4" aria-label="まんなか"></button><button class="cell" type="button" data-index="5" aria-label="右まんなか"></button><button class="cell" type="button" data-index="6" aria-label="左下"></button><button class="cell" type="button" data-index="7" aria-label="下まんなか"></button><button class="cell" type="button" data-index="8" aria-label="右下"></button></div></section>
    <section class="status" aria-live="polite"><div class="status-main" id="statusMain">○ の ばんだよ</div><div class="status-sub" id="statusSub">すきなマスを タッチしてね</div></section>
    <div class="score" aria-label="スコア"><span>○ <b id="scoreO">0</b>しょう</span><span>ひきわけ <b id="scoreD">0</b></span><span>× <b id="scoreX">0</b>しょう</span></div><div class="actions"><button class="restart" id="restartBtn" type="button">↻ もういちど</button></div><p class="footer-note" id="footerNote">おともだちと こうたいで ○と×を かいてね。</p>
  </div></main>
  <script>
  (()=>{const cells=[...document.querySelectorAll('.cell')],friendBtn=document.getElementById('friendBtn'),cpuBtn=document.getElementById('cpuBtn'),restartBtn=document.getElementById('restartBtn'),statusMain=document.getElementById('statusMain'),statusSub=document.getElementById('statusSub'),footerNote=document.getElementById('footerNote'),scoreO=document.getElementById('scoreO'),scoreX=document.getElementById('scoreX'),scoreD=document.getElementById('scoreD');const labels=['左上','上まんなか','右上','左まんなか','まんなか','右まんなか','左下','下まんなか','右下'];const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),turn='O',mode='friend',gameOver=false,thinking=false;const scores={O:0,X:0,D:0};
  function markSvg(mark,i){const w=i%3;if(mark==='O')return `<svg class="mark scribble" viewBox="0 0 100 100" aria-hidden="true"><path d="M ${50+w} 11 C 26 8,11 26,12 51 C 13 76,29 91,52 89 C 77 88,91 72,89 48 C 88 24,73 11,${50+w} 11 Z"/><path opacity=".22" d="M 51 14 C 29 12,16 29,17 51 C 18 72,32 86,52 85"/></svg>`;return `<svg class="mark scribble" viewBox="0 0 100 100" aria-hidden="true"><path d="M ${18+(i%2)} 17 C 37 36,61 61,82 83"/><path d="M 82 18 C 63 37,39 61,18 82"/><path opacity=".20" d="M 21 20 C 40 39,59 58,79 79"/></svg>`}
  function winner(m){return wins.find(line=>line.every(i=>board[i]===m))||null}function render(){cells.forEach((c,i)=>{c.innerHTML=board[i]?markSvg(board[i],i):'';c.disabled=gameOver||thinking||!!board[i];c.setAttribute('aria-label',labels[i]+(board[i]?`：${board[i]==='O'?'まる':'ばつ'}`:''))})}function updateScores(){scoreO.textContent=scores.O;scoreX.textContent=scores.X;scoreD.textContent=scores.D}
  function finish(m){if(winner(m)){gameOver=true;scores[m]++;updateScores();statusMain.textContent=`${m==='O'?'○':'×'} が 3つ ならんだ！`;statusSub.textContent='やったー！ いい しょうぶだったね';footerNote.textContent='「もういちど」を おして つぎの しょうぶ！';render();return true}if(board.every(Boolean)){gameOver=true;scores.D++;updateScores();statusMain.textContent='ひきわけ！';statusSub.textContent='どっちも 3つ ならばなかったね';footerNote.textContent='いい しょうぶ！ もういちど やってみよう。';render();return true}return false}
  function nextFriend(){turn=turn==='O'?'X':'O';statusMain.textContent=`${turn==='O'?'○':'×'} の ばんだよ`;statusSub.textContent='あいてのマークも よくみてね';render()}
  function cpuChoice(){const e=board.map((v,i)=>v?null:i).filter(i=>i!==null);for(const i of e){board[i]='X';if(winner('X')){board[i]='';return i}board[i]=''}for(const i of e){board[i]='O';if(winner('O')){board[i]='';return i}board[i]=''}if(board[4]==='')return 4;const corners=[0,2,6,8].filter(i=>board[i]==='');if(corners.length)return corners[Math.floor(Math.random()*corners.length)];return e[Math.floor(Math.random()*e.length)]}
  function cpuMove(){if(gameOver)return;thinking=true;statusMain.textContent='× が かんがえちゅう…';statusSub.textContent='ちょっと まってね';render();setTimeout(()=>{const m=cpuChoice();if(Number.isInteger(m))board[m]='X';thinking=false;if(!finish('X')){turn='O';statusMain.textContent='○ の ばんだよ';statusSub.textContent='どこに おこうかな？';render()}},430)}
  function play(i){if(gameOver||thinking||board[i])return;board[i]=turn;render();if(finish(turn))return;if(mode==='cpu'&&turn==='O'){turn='X';cpuMove()}else nextFriend()}
  function reset(){board=Array(9).fill('');turn='O';gameOver=false;thinking=false;statusMain.textContent='○ の ばんだよ';statusSub.textContent='すきなマスを タッチしてね';footerNote.textContent=mode==='friend'?'おともだちと こうたいで ○と×を かいてね。':'ゆっくりくんは ○。コンピューターは × だよ。';render()}function setMode(m){mode=m;friendBtn.setAttribute('aria-pressed',String(m==='friend'));cpuBtn.setAttribute('aria-pressed',String(m==='cpu'));reset()}
  cells.forEach(c=>c.addEventListener('click',()=>play(Number(c.dataset.index))));friendBtn.addEventListener('click',()=>setMode('friend'));cpuBtn.addEventListener('click',()=>setMode('cpu'));restartBtn.addEventListener('click',reset);render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
  </script>
</body></html>
